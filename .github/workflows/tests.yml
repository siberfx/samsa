name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  sqlite:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
        exclude:
          - php: '8.2'
            laravel: '13.*' # Laravel 13 requires PHP 8.3+
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: pdo_sqlite, pcntl
          coverage: none
      - run: |
          # siberfx/message-bus needs Laravel 13; its tests skip themselves without it.
          if [ "${{ matrix.laravel }}" = "12.*" ]; then composer remove --dev siberfx/message-bus --no-interaction --no-update; fi
          composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit --testsuite Unit,Contract,Feature

  databases:
    name: ${{ matrix.db }} (multi-process)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
            user: root
            password: ''
          - db: pgsql
            port: 5432
            user: postgres
            password: postgres
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: samsa_test
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: samsa_test
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pcntl
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
        env:
          SAMSA_TEST_DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: samsa_test
          DB_USERNAME: ${{ matrix.user }}
          DB_PASSWORD: ${{ matrix.password }}

  nats:
    name: nats (contract, end-to-end, multi-process)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: samsa_test
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      # Services can't take command arguments, and NATS needs --jetstream.
      - run: docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.10-alpine --jetstream -m 8222
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: pdo_pgsql, pcntl
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: curl --retry 10 --retry-connrefused -s http://127.0.0.1:8222/healthz
      - run: vendor/bin/phpunit
        env:
          NATS_HOST: 127.0.0.1
          SAMSA_TEST_DRIVER: nats
          SAMSA_TEST_DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: samsa_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
